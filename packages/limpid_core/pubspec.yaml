name: limpid_core
description: >-
  Pure Dart core domain model and CRDT sync engine for Limpid. Shared contract
  between the Flutter client and the Dart API. Never imports Flutter.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

# No runtime dependencies on purpose: limpid_core is imported by both the
# Flutter client and the Dart server, so it must stay buildable offline with
# the SDK alone.
dependencies:

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.0
