name: CodeQL

# Analyse statique de sécurité du monorepo Limpid.
#
# D-19 (sécurité) : le code est analysé en continu, sur chaque branche et sur
# les pull requests, en plus de la chaîne de vérification de ci.yml.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Analyse hebdomadaire, le lundi à 03:17 UTC.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (dart)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Dart n'est pas encore un langage pris en charge par CodeQL en version
    # générale (demande amont : https://github.com/orgs/community/discussions/175533).
    # L'étape reste câblée sur `dart` pour être activée dès que l'extracteur
    # est publié, mais elle ne bloque pas le dépôt tant que ce n'est pas le cas.
    continue-on-error: true

    permissions:
      # Nécessaires au rapport de l'analyse de sécurité.
      security-events: write
      packages: read
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.12.2"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: dart
          queries: security-and-quality

      - name: Perform the CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:dart"
