# Melos configuration of the Limpid monorepo.
#
# Melos 6.x reads this file. Melos 7 and above moved the configuration into
# the `melos:` section of the root pubspec.yaml and require every package to
# opt into the Dart pub workspace; the migration is described in
# docs/DEVELOPMENT.md.

name: limpid

# Le dépôt public n'existe pas encore. Renseigner l'URL du dépôt distant ici
# pour activer `melos version` et `melos publish` :
#
# repository: https://github.com/<organisation>/limpid.git

# Every member of the monorepo (D-23). Melos silently ignores the paths that
# do not exist yet, so the packages under construction can be listed here
# before they are created.
packages:
  - packages/limpid_core
  - packages/limpid_design_system
  - packages/limpid_ai
  - packages/limpid_export
  - packages/limpid_sync
  - packages/limpid_quill
  - apps/limpid_api
  - apps/limpid_app

# Sources generated by the Flutter tool, never committed and never analysed.
ignore:
  - "**/generated_plugin_registrant.dart"

# Melos generates IntelliJ project files by default. The repository does not
# version IDE settings, so the generation is disabled.
ide:
  intellij:
    enabled: false

# Path dependencies between the packages of the monorepo are always resolved
# locally: `melos bootstrap` writes a pubspec_overrides.yaml in each package.
# The flag below states that behaviour explicitly (mandatory with melos 5,
# always enabled with melos 6).
usePubspecOverrides: true

command:
  bootstrap:
    # Resolving the packages in parallel is faster but makes the output much
    # harder to read when a single package fails. Keep it sequential.
    runPubGetInParallel: false
    # Never rewrite a committed lock file during a bootstrap.
    enforceLockfile: false
  format:
    lineLength: 80
    setExitIfChanged: false

# The scripts call melos through `dart run melos` rather than through the
# `melos` executable: melos is a dev_dependency of the root package, so no
# global installation is needed and the version used is the one pinned in
# pubspec.yaml.
scripts:
  bootstrap:
    description: Resolve the dependencies of every package of the monorepo.
    run: dart run melos bootstrap

  analyze:
    description: Run the static analysis on every package of the monorepo.
    run: dart run melos analyze --fatal-infos --fatal-warnings

  test:
    description: Run the unit tests of every package of the monorepo.
    run: |
      dart run melos exec --no-flutter -- dart test
      dart run melos exec --flutter -- flutter test

  test:ci:
    description: >-
      Run the unit tests in CI mode: no concurrency, expanded reporter and
      fail fast on the first broken package.
    run: |
      dart run melos exec --no-flutter --fail-fast -- dart test --reporter expanded --concurrency=1
      dart run melos exec --flutter --fail-fast -- flutter test --concurrency=1

  format:
    description: Format the Dart sources of every package of the monorepo.
    run: dart run melos format

  format:check:
    description: Fail when a Dart source of the monorepo is not formatted.
    run: dart run melos format --set-exit-if-changed

  # The build scripts are scoped to the Flutter application.
  #
  # `packageFilters` makes melos fail loudly when the application does not
  # exist yet (no package matches the scope), and `melos exec` runs the build
  # from the directory of the package.
  build:web:
    description: Build the Flutter web application (PWA).
    packageFilters:
      scope: limpid_app
    run: dart run melos exec --scope=limpid_app -- flutter build web --release

  build:desktop:
    description: Build the Flutter desktop application.
    packageFilters:
      scope: limpid_app
    run: dart run melos exec --scope=limpid_app -- flutter build windows --release

  build:android:
    description: Build the Flutter Android application.
    packageFilters:
      scope: limpid_app
    run: dart run melos exec --scope=limpid_app -- flutter build apk --release

  build:ios:
    description: Build the Flutter iOS application.
    packageFilters:
      scope: limpid_app
    run: dart run melos exec --scope=limpid_app -- flutter build ios --release --no-codesign

  ci:
    description: >-
      Full verification chain of the monorepo: formatting, static analysis
      and unit tests.
    run: |
      dart run melos run format:check
      dart run melos run analyze
      dart run melos run test:ci
