<title>Limpid</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ============================================================================
   LIMPID — Spec sheet + maquettes
   Chrome de page = neutres froids. Toute la couleur vient des maquettes.
   Les tokens produit (--p-*) reprennent docs/DESIGN_SYSTEM.md à l'identique.
   ========================================================================== */

:root {
  --pg-bg: #F1F2F4;
  --pg-surface: #FFFFFF;
  --pg-sunken: #E7E9EC;
  --pg-fg: #14171A;
  --pg-muted: #5A6169;
  --pg-faint: #8A929B;
  --pg-line: #DFE2E6;
  --pg-line-strong: #C3C8CE;
  --pg-ink: #14171A;
  --pg-ink-hover: #2A2F34;
  --pg-focus: #1F5FCC;
  --pg-radius: 10px;
  --pg-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --pg-ui: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --pg-display: "Fraunces", Georgia, "Times New Roman", serif;
  --pg-serif: "Literata", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --pg-bg: #0E1012;
    --pg-surface: #171A1D;
    --pg-sunken: #1F2327;
    --pg-fg: #EDEFF2;
    --pg-muted: #9AA3AD;
    --pg-faint: #767E87;
    --pg-line: #262B30;
    --pg-line-strong: #3A4148;
    --pg-ink: #EDEFF2;
    --pg-ink-hover: #FFFFFF;
    --pg-focus: #7FA9FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --pg-bg: #0E1012;
  --pg-surface: #171A1D;
  --pg-sunken: #1F2327;
  --pg-fg: #EDEFF2;
  --pg-muted: #9AA3AD;
  --pg-faint: #767E87;
  --pg-line: #262B30;
  --pg-line-strong: #3A4148;
  --pg-ink: #EDEFF2;
  --pg-ink-hover: #FFFFFF;
  --pg-focus: #7FA9FF;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--pg-bg);
  color: var(--pg-fg);
  font-family: var(--pg-ui);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
h1, h2, h3, h4 { margin: 0; font-weight: 600; }
p { margin: 0; }
button { font: inherit; color: inherit; }
a { color: inherit; }
::selection { background: #9C551833; }

/* ---------- En-tête de page ---------- */
.page-head {
  display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px 24px;
  padding-bottom: 18px; margin-bottom: 20px;
  border-bottom: 1px solid var(--pg-line);
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand-mark {
  font-family: var(--pg-display); font-weight: 600; font-size: 27px;
  letter-spacing: -0.02em; color: var(--pg-ink); white-space: nowrap;
}
.brand-mark .dot { color: #9C5518; }
.brand-sub { color: var(--pg-muted); font-size: 13px; }
.page-head .spacer { flex: 1 1 120px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg {
  display: inline-flex; background: var(--pg-sunken); border-radius: 999px;
  padding: 3px; gap: 2px; border: 1px solid var(--pg-line);
}
.seg button {
  border: 0; background: transparent; padding: 5px 12px; border-radius: 999px;
  font-size: 12.5px; font-weight: 500; color: var(--pg-muted); cursor: pointer;
  white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--pg-surface); color: var(--pg-ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.seg button:hover { color: var(--pg-ink); }
.ctl-label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--pg-faint); font-weight: 500; margin-right: 2px; }

/* ---------- Index ---------- */
.page-body { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 26px; align-items: start; }
.index { position: sticky; top: 16px; max-height: calc(100vh - 40px); overflow-y: auto; padding-right: 4px; }
.index-group { margin-bottom: 18px; }
.index-group h4 {
  font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--pg-faint); margin-bottom: 6px; font-weight: 600;
}
.index a {
  display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 7px;
  color: var(--pg-muted); text-decoration: none; font-size: 13px; cursor: pointer;
  border: 1px solid transparent;
}
.index a:hover { background: var(--pg-sunken); color: var(--pg-fg); }
.index a[aria-current="true"] {
  background: var(--pg-surface); color: var(--pg-ink); font-weight: 500;
  border-color: var(--pg-line); box-shadow: 0 1px 2px rgba(0,0,0,.06);
}
.index .idx-num { font-family: var(--pg-mono); font-size: 10.5px; color: var(--pg-faint); min-width: 18px; }
.index a[aria-current="true"] .idx-num { color: #9C5518; }

/* ---------- Zone principale ---------- */
.main { min-width: 0; }
.screen-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 14px; }
.screen-head h2 { font-family: var(--pg-display); font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
.screen-head .meta { color: var(--pg-muted); font-size: 12.5px; }
.screen-head .meta code { font-family: var(--pg-mono); font-size: 11.5px; background: var(--pg-sunken); padding: 1px 5px; border-radius: 4px; }
.spec-line {
  font-size: 12.5px; color: var(--pg-muted); border-left: 2px solid var(--pg-line-strong);
  padding-left: 12px; margin: 0 0 14px;
}

/* ---------- Stage + device frame ---------- */
.stage {
  background:
    repeating-linear-gradient(45deg, var(--pg-sunken) 0 8px, transparent 8px 16px);
  border: 1px solid var(--pg-line); border-radius: 14px;
  padding: 22px; display: flex; justify-content: center; align-items: flex-start;
  overflow: auto; min-height: 420px;
}
.frame-wrap { position: relative; flex: none; }
.frame {
  position: absolute; top: 0; left: 0; transform-origin: top left;
  container-type: inline-size; container-name: app;
  background: var(--p-bg-canvas); color: var(--p-fg-default);
  font-family: var(--pg-ui); font-size: 14px; line-height: 1.5;
  border-radius: 10px; overflow: hidden; border: 1px solid var(--pg-line-strong);
  box-shadow: 0 18px 50px rgba(0,0,0,.22);
}
.frame-wrap.desktop .frame { border-radius: 8px; }
.frame-wrap.phone .frame { border-radius: 26px; border: 5px solid #1b1d20; box-shadow: 0 18px 50px rgba(0,0,0,.35); }
.phone-notch { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: 110px; height: 22px; background: #1b1d20; border-radius: 12px; z-index: 40; }

/* ---------- Tokens produit (4 thèmes) ---------- */
[data-product="paper"] {
  --p-bg-canvas:#FAF8F4; --p-bg-surface:#FFFFFF; --p-bg-raised:#FFFFFF; --p-bg-sunken:#F2EEE6;
  --p-fg-default:#16130F; --p-fg-muted:#57504A; --p-fg-subtle:#857C72;
  --p-border-subtle:#E7E1D6; --p-border-default:#D8D0C2; --p-border-strong:#BCB2A0;
  --p-accent:#9C5518; --p-accent-hover:#83450F; --p-accent-subtle:#F6E7D6; --p-accent-border:#E4C4A0; --p-fg-on-accent:#FFFFFF;
  --p-secondary:#35407E; --p-secondary-subtle:#E8EAF7;
  --p-success:#3E6B4F; --p-warning:#8A6410; --p-danger:#A8341F; --p-info:#2E5F7A;
  --p-shadow: 0 1px 2px rgba(22,19,15,.07), 0 1px 1px rgba(22,19,15,.04);
  --p-shadow-2: 0 8px 24px rgba(22,19,15,.13);
}
[data-product="sepia"] {
  --p-bg-canvas:#F4EBD8; --p-bg-surface:#FBF6EA; --p-bg-raised:#FFFDF8; --p-bg-sunken:#E9DEC6;
  --p-fg-default:#33281A; --p-fg-muted:#6B5C48; --p-fg-subtle:#8C7C64;
  --p-border-subtle:#DFD3B8; --p-border-default:#CDBFA0; --p-border-strong:#B3A184;
  --p-accent:#8E4A12; --p-accent-hover:#763C0B; --p-accent-subtle:#F0E0C8; --p-accent-border:#DCBC93; --p-fg-on-accent:#FFFFFF;
  --p-secondary:#2F3A72; --p-secondary-subtle:#E4E7F5;
  --p-success:#356043; --p-warning:#7A5810; --p-danger:#97301C; --p-info:#28566F;
  --p-shadow: 0 1px 2px rgba(51,40,26,.08); --p-shadow-2: 0 8px 24px rgba(51,40,26,.15);
}
[data-product="night"] {
  --p-bg-canvas:#14110E; --p-bg-surface:#1C1915; --p-bg-raised:#242019; --p-bg-sunken:#0F0D0A;
  --p-fg-default:#F0EBE2; --p-fg-muted:#A79E92; --p-fg-subtle:#7A7268;
  --p-border-subtle:#2B261F; --p-border-default:#3A332A; --p-border-strong:#4C4438;
  --p-accent:#E0A460; --p-accent-hover:#F0BC85; --p-accent-subtle:#2E2418; --p-accent-border:#4A3A22; --p-fg-on-accent:#1A1207;
  --p-secondary:#9BA4E8; --p-secondary-subtle:#1E2138;
  --p-success:#7FB093; --p-warning:#D9A845; --p-danger:#E08573; --p-info:#7FB3CE;
  --p-shadow: 0 1px 2px rgba(0,0,0,.5); --p-shadow-2: 0 8px 28px rgba(0,0,0,.6);
}
[data-product="contrast"] {
  --p-bg-canvas:#000000; --p-bg-surface:#000000; --p-bg-raised:#0A0A0A; --p-bg-sunken:#000000;
  --p-fg-default:#FFFFFF; --p-fg-muted:#FFFFFF; --p-fg-subtle:#E6E6E6;
  --p-border-subtle:#FFFFFF; --p-border-default:#FFFFFF; --p-border-strong:#FFFFFF;
  --p-accent:#FFB454; --p-accent-hover:#FFC87A; --p-accent-subtle:#2A2013; --p-accent-border:#6B5223; --p-fg-on-accent:#000000;
  --p-secondary:#AEB6F5; --p-secondary-subtle:#1A1D2E;
  --p-success:#6ED79B; --p-warning:#FFC44D; --p-danger:#FF8A72; --p-info:#7FD4F5;
  --p-shadow: none; --p-shadow-2: none;
}

/* ---------- Primitives produit ---------- */
.app { display: flex; flex-direction: column; height: 100%; }
.app-row { display: flex; flex: 1; min-height: 0; }
.col { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.grow { flex: 1; min-width: 0; }
.pad { padding: 20px; }
.scroll { overflow: auto; }

.p-topbar {
  height: 52px; flex: none; display: flex; align-items: center; gap: 12px;
  padding: 0 14px; background: var(--p-bg-surface);
  border-bottom: 1px solid var(--p-border-subtle);
}
.p-brand { font-family: var(--pg-display); font-weight: 600; font-size: 17px; letter-spacing: -.01em; color: var(--p-fg-default); }
.p-brand span { color: var(--p-accent); }
.p-proj {
  display: flex; align-items: center; gap: 8px; padding: 5px 9px; border-radius: 8px;
  background: var(--p-bg-sunken); font-size: 13px; font-weight: 500; color: var(--p-fg-default);
}
.p-search {
  flex: 1; max-width: 380px; height: 32px; display: flex; align-items: center; gap: 8px;
  padding: 0 10px; border-radius: 8px; border: 1px solid var(--p-border-subtle);
  background: var(--p-bg-canvas); color: var(--p-fg-subtle); font-size: 13px;
}
.p-kbd {
  margin-left: auto; font-family: var(--pg-mono); font-size: 10.5px;
  border: 1px solid var(--p-border-default); border-radius: 5px; padding: 1px 5px;
  color: var(--p-fg-subtle); background: var(--p-bg-surface);
}
.p-rail {
  width: 232px; flex: none; background: var(--p-bg-surface);
  border-right: 1px solid var(--p-border-subtle); padding: 12px 10px; overflow: auto;
}
.p-rail h5 {
  font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--p-fg-subtle);
  margin: 14px 8px 6px; font-weight: 600;
}
.p-nav {
  display: flex; align-items: center; gap: 10px; padding: 7px 9px; border-radius: 8px;
  font-size: 13.5px; color: var(--p-fg-muted); cursor: default;
}
.p-nav .ic { width: 16px; height: 16px; flex: none; opacity: .8; }
.ic { width: 16px; height: 16px; flex: none; display: block; }
.p-tool .ic { width: 15px; height: 15px; }
.p-btn .ic { width: 15px; height: 15px; }
.p-chip .ic { width: 13px; height: 13px; }
.p-bottomnav .ic { width: 20px; height: 20px; }
.p-empty .glyph .ic { width: 26px; height: 26px; }
.p-panel-head .ic, .p-banner .ic { width: 15px; height: 15px; }
.p-nav.active { background: var(--p-accent-subtle); color: var(--p-accent); font-weight: 600; }
.p-nav.active .ic { opacity: 1; }
.p-nav .count { margin-left: auto; font-family: var(--pg-mono); font-size: 11px; color: var(--p-fg-subtle); }
.p-rail-foot { margin-top: 14px; padding: 10px; border-radius: 10px; background: var(--p-bg-canvas); border: 1px solid var(--p-border-subtle); }

.p-toolbar {
  height: 44px; flex: none; display: flex; align-items: center; gap: 6px;
  padding: 0 12px; background: var(--p-bg-surface); border-bottom: 1px solid var(--p-border-subtle);
}
.p-tool {
  height: 28px; min-width: 28px; padding: 0 7px; display: inline-flex; align-items: center; gap: 6px;
  border-radius: 7px; color: var(--p-fg-muted); font-size: 12.5px; cursor: default;
}
.p-tool.on { background: var(--p-accent-subtle); color: var(--p-accent); }
.p-tool .sep { width: 1px; height: 18px; background: var(--p-border-default); margin: 0 4px; }

.p-panel {
  width: 312px; flex: none; background: var(--p-bg-surface);
  border-left: 1px solid var(--p-border-subtle); display: flex; flex-direction: column;
}
.p-panel.ai { border-left: 2px solid var(--p-secondary); }
.p-panel-head {
  padding: 12px 14px; border-bottom: 1px solid var(--p-border-subtle);
  display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600;
}
.p-panel-body { padding: 14px; overflow: auto; }

.p-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 34px; padding: 0 14px; border-radius: 9px; font-size: 13.5px; font-weight: 500;
  border: 1px solid transparent; cursor: default; white-space: nowrap;
}
.p-btn.primary { background: var(--p-accent); color: var(--p-fg-on-accent); }
.p-btn.secondary { background: var(--p-bg-surface); color: var(--p-fg-default); border-color: var(--p-border-default); }
.p-btn.ghost { color: var(--p-fg-muted); }
.p-btn.danger { background: var(--p-danger); color: #fff; }
.p-btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; border-radius: 7px; }
.p-btn.lg { height: 44px; padding: 0 20px; font-size: 15px; border-radius: 11px; }
.p-btn.block { width: 100%; }

.p-card {
  background: var(--p-bg-surface); border: 1px solid var(--p-border-subtle);
  border-radius: 14px; padding: 16px;
}
.p-card.raised { box-shadow: var(--p-shadow); }
.p-card h4 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.p-card .sub { font-size: 12.5px; color: var(--p-fg-muted); }

.p-chip {
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px;
  border-radius: 999px; font-size: 11.5px; font-weight: 500;
  background: var(--p-bg-sunken); color: var(--p-fg-muted);
}
.p-chip.accent { background: var(--p-accent-subtle); color: var(--p-accent); }
.p-chip.ai { background: var(--p-secondary-subtle); color: var(--p-secondary); }
.p-chip.ok { background: color-mix(in srgb, var(--p-success) 14%, transparent); color: var(--p-success); }
.p-chip.warn { background: color-mix(in srgb, var(--p-warning) 16%, transparent); color: var(--p-warning); }
.p-chip.err { background: color-mix(in srgb, var(--p-danger) 14%, transparent); color: var(--p-danger); }
.p-chip.info { background: color-mix(in srgb, var(--p-info) 14%, transparent); color: var(--p-info); }
.p-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }

.p-field { display: flex; flex-direction: column; gap: 6px; }
.p-field label { font-size: 12.5px; font-weight: 500; color: var(--p-fg-default); }
.p-input {
  height: 38px; border-radius: 9px; border: 1px solid var(--p-border-default);
  background: var(--p-bg-surface); padding: 0 11px; display: flex; align-items: center;
  font-size: 13.5px; color: var(--p-fg-default);
}
.p-input.ph { color: var(--p-fg-subtle); }
.p-input.focus { border-color: var(--p-accent); box-shadow: 0 0 0 3px var(--p-accent-subtle); }
.p-hint { font-size: 12px; color: var(--p-fg-muted); }
.p-hint.err { color: var(--p-danger); }

.p-banner {
  display: flex; align-items: flex-start; gap: 10px; padding: 11px 13px; border-radius: 10px;
  font-size: 13px; border: 1px solid;
}
.p-banner .ic { flex: none; margin-top: 1px; }
.p-banner.warn { background: color-mix(in srgb, var(--p-warning) 10%, transparent); border-color: color-mix(in srgb, var(--p-warning) 35%, transparent); color: var(--p-fg-default); }
.p-banner.warn .ic { color: var(--p-warning); }
.p-banner.info { background: var(--p-secondary-subtle); border-color: color-mix(in srgb, var(--p-secondary) 30%, transparent); color: var(--p-fg-default); }
.p-banner.info .ic { color: var(--p-secondary); }
.p-banner.danger { background: color-mix(in srgb, var(--p-danger) 10%, transparent); border-color: color-mix(in srgb, var(--p-danger) 35%, transparent); color: var(--p-fg-default); }
.p-banner.danger .ic { color: var(--p-danger); }

.p-page { padding: 24px 28px; }
.p-h1 { font-family: var(--pg-display); font-size: 26px; font-weight: 600; letter-spacing: -.01em; }
.p-h2 { font-family: var(--pg-display); font-size: 19px; font-weight: 600; }
.p-sub { color: var(--p-fg-muted); font-size: 13px; }
.p-sec-title { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--p-fg-subtle); font-weight: 600; margin: 0 0 10px; }

.p-grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0,1fr)); }

.p-stat { background: var(--p-bg-surface); border: 1px solid var(--p-border-subtle); border-radius: 14px; padding: 14px 16px; }
.p-stat .k { font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--p-fg-subtle); font-weight: 600; }
.p-stat .v { font-family: var(--pg-display); font-size: 27px; font-weight: 600; line-height: 1.15; margin-top: 4px; font-variant-numeric: tabular-nums; }
.p-stat .d { font-size: 12px; color: var(--p-fg-muted); margin-top: 3px; }

.p-cover {
  aspect-ratio: 2/3; border-radius: 3px; position: relative; overflow: hidden;
  background: #2F3A44; color: #F4E9D8; padding: 16px 14px;
  display: flex; flex-direction: column; justify-content: space-between;
  box-shadow: 0 6px 18px rgba(0,0,0,.25);
}
.p-cover .t { font-family: var(--pg-display); font-size: 17px; font-weight: 600; line-height: 1.15; }
.p-cover .a { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; opacity: .82; }
.p-cover.c1 { background: linear-gradient(160deg, #3A4A52, #1E2A31); }
.p-cover.c2 { background: linear-gradient(160deg, #7A4A28, #40230F); }
.p-cover.c3 { background: linear-gradient(160deg, #4A3B62, #241C33); }
.p-cover.c4 { background: linear-gradient(160deg, #35513F, #16281E); }
.p-cover.c5 { background: linear-gradient(160deg, #6B3A3A, #331919); }
.p-cover.c6 { background: linear-gradient(160deg, #55585E, #26282C); }

/* Couverture dérivée des tokens : la palette du livre suit le thème.
   Le mélange se fait vers fgDefault en thème clair, vers bgCanvas en thème
   sombre — c'est la règle du widget ProjectCover.
   Le titre porte fgOnAccent (l'encre prévue pour un texte posé sur
   l'accent) ; l'auteur, posé sur la moitié sombre du dégradé, porte
   l'encre claire du thème. */
.p-cover.tp {
  background: linear-gradient(160deg, var(--c), color-mix(in srgb, var(--c) 45%, var(--p-fg-default)));
  color: var(--p-fg-on-accent);
  --ink-bottom: var(--p-bg-canvas);
}
.p-cover.tp .a { color: var(--ink-bottom); }
.p-cover.tp-0 { --c: var(--p-accent); }
.p-cover.tp-1 { --c: var(--p-secondary); }
.p-cover.tp-2 { --c: var(--p-success); }
.p-cover.tp-3 { --c: var(--p-warning); }

{
  id:'editor-review', group:'Relecture', name:'Éditeur — Relecture', dev:'desktop',
  spec:'Chapitre en flux continu · commentaires en marge 320 · lecture sans distraction',
  notes:[
    ['Lecture continue','Le chapitre se lit d’un bout à l’autre, sans rupture de scène : c’est le mode de relecture, distinct du mode d’écriture.'],
    ['ancres de commentaire','Un commentaire est ancré à une plage de caractères ; le survol du texte révèle le fil correspondant en marge.'],
    ['Fil de discussion','Les réponses restent dans la marge, hors du texte : le manuscrit reste propre et exportable.']
  ],
  html:()=>`<div class="app">
    ${topbar()}
    <div class="app-row">
      ${outline('c2b', CH.outline)}
      <div class="col grow" style="background:var(--p-bg-canvas)">

          <span class="sep"></span>
          <span class="p-tool">${I.comment}3 commentaires</span>
          <span class="p-tool">${I.flag}2 signalements</span>
          <span style="margin-left:auto"><span class="p-chip">Chapitre II · continu</span></span>
        </div>
        <div class="scroll" style="flex:1;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:0">
          <div class="p-manuscript" style="padding-top:26px">
            <div class="scene-label">Chapitre II — La cloche de Saint‑Mérien</div>
            <h2>Le cycle de douze minutes</h2>
            <p>La cloche sonna à quatre heures douze. Maëlle compta les douze minutes du cycle sans les nommer, comme on compte une respiration.</p>
            <p>Le sel avait formé sur les vitres une croûte blanche, et elle passa le pouce dessus pour en mesurer l'épaisseur. Un millimètre, peut-être deux. Le sel n'était pas venu de la mer ce matin-là : il était venu de l'intérieur des murs, poussé par la nuit.</p>
            <p><mark class="hot">Dans la salle des archives, les dossiers s'appuyaient les uns contre les autres</mark><span style="vertical-align:super;font-size:10px;color:var(--p-secondary);font-weight:700">1</span>, guettés par la poussière. Chaque marée, le village effaçait ce qu'il venait de dire.</p>
            <p>C'était écrit dans le registre municipal, à la page 214, à l'encre violette que personne ne voulait lire. Maëlle avait appris à déchiffrer cette encre-là la semaine précédente, un soir de marée basse, en buvant du café froid.</p>
            <p>Dehors, la cloche de quatre heures douze sonnait une deuxième fois, et personne ne vint.</p>
            <p>« Vous comptez encore », dit la femme au manteau gris depuis le fond de la salle. « Vous comptez quoi, exactement ? »</p>
            <p>Maëlle referma le registre. <span style="border-bottom:2px dotted var(--p-secondary)">Elle ne se retourna pas</span><span style="vertical-align:super;font-size:10px;color:var(--p-secondary);font-weight:700">2</span>. Le registre, lui, resta ouvert à la page 214.</p>
          </div>
          <div style="border-left:1px solid var(--p-border-subtle);padding:16px;background:var(--p-bg-surface);overflow:auto">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
              <span class="p-sec-title" style="margin:0">Commentaires</span>
              <span class="p-chip" style="margin-left:auto">3</span>
            </div>
            <div class="p-comment">
              <div class="who"><span class="p-avatar t-success">IB</span>Inès Barreau <time>il y a 2 h</time></div>
              <p>« Vous comptez encore » — j'adore cette entrée. Mais elle ne peut pas savoir qu'elle l'a déjà dit au chapitre I. On perd la intrigue.</p>
              <div style="display:flex;gap:10px;margin-top:7px;font-size:11.5px;color:var(--p-fg-subtle)"><span style="color:var(--p-accent);text-decoration:underline">Répondre</span><span>Résoudre</span></div>
            </div>
            <div class="p-comment">
              <div class="who"><span class="p-avatar t-warning">TD</span>Thomas Derval <time>hier</time></div>
              <p>Le sel qui vient des murs : très bien. On l'a posé au chapitre I, ne le redisons pas comme une découverte.</p>
              <div style="display:flex;gap:10px;margin-top:7px;font-size:11.5px;color:var(--p-fg-subtle)"><span style="color:var(--p-accent);text-decoration:underline">Répondre</span><span>Résoudre</span></div>
            </div>
            <div class="p-comment" style="border-left-color:var(--p-border-default);opacity:.75">

            <div style="padding:11px;border:1px dashed var(--p-border-strong);border-radius:10px;font-size:12.5px;color:var(--p-fg-muted);text-align:center">Cliquer sur un passage du texte pour commenter</div>

/* ==========================================================================
   RENDU
   ========================================================================== */
const SIZES = { desktop:[1440,900], laptop:[1280,800], tablet:[834,1112], phone:[390,844] };
const state = { id:'landing', device:'desktop', product:'paper', sync:'online', annot:'off' };

const byId = Object.fromEntries(SCREENS.map(s => [s.id, s]));

function buildIndex(){
  const groups = [];
  SCREENS.forEach(s => {
    let g = groups.find(x => x.name === s.group);
    if (!g) { g = { name:s.group, items:[] }; groups.push(g); }
    g.items.push(s);
  });
  const nav = document.getElementById('index');
  nav.innerHTML = groups.map(g => `
    <div class="index-group">
      <h4>${g.name}</h4>
      ${g.items.map(s => `<a href="#${s.id}" data-go="${s.id}"><span class="idx-num">${String(SCREENS.indexOf(s)+1).padStart(2,'0')}</span><span>${s.name}</span></a>`).join('')}
    </div>`).join('');
  nav.querySelectorAll('[data-go]').forEach(a => {
    a.addEventListener('click', e => { e.preventDefault(); location.hash = a.dataset.go; });
  });
}

function effectiveDevice(){
  const s = byId[state.id] || SCREENS[0];
  return s.dev === 'phone' ? 'phone' : state.device;
}

function fit(){
  const stage = document.getElementById('stage');
  const wrap  = document.getElementById('frame-wrap');
  const frame = document.getElementById('frame');
  const dev = effectiveDevice();
  const [w, h] = SIZES[dev];
  frame.style.width = w + 'px';
  frame.style.height = h + 'px';
  const availW = Math.max(280, stage.clientWidth - 46);
  const availH = Math.max(360, Math.min(window.innerHeight - 230, 940));
  const s = dev === 'phone'
    ? Math.min(1.35, availW / w)
    : Math.min(1, availW / w, availH / h);
  wrap.style.width = Math.round(w * s) + 'px';
  wrap.style.height = Math.round(h * s) + 'px';
  frame.style.transform = 'scale(' + s + ')';
  wrap.classList.toggle('phone', dev === 'phone');
  const notch = wrap.querySelector('.phone-notch');
  if (dev === 'phone' && !notch) {
    const n = document.createElement('div'); n.className = 'phone-notch'; wrap.appendChild(n);
  } else if (dev !== 'phone' && notch) { notch.remove(); }
  setSeg('seg-device', 'device', dev);
}

function render(){
  const s = byId[state.id] || SCREENS[0];
  state.id = s.id;
  window.__syncState = state.sync;

  const frame = document.getElementById('frame');
  frame.setAttribute('data-product', state.product);
  frame.innerHTML = s.html();

  document.getElementById('scr-title').textContent = s.name;
  document.getElementById('scr-meta').innerHTML =
    '<code>' + s.group + '</code> · ' + (s.dev === 'phone' ? 'Mobile 390 × 844' : 'Bureau') +
    ' · Thème <code>' + (state.product === 'contrast' ? 'Contraste élevé' : state.product === 'paper' ? 'Papier' : state.product === 'sepia' ? 'Sépia' : 'Nuit') + '</code>';
  document.getElementById('scr-spec').textContent = s.spec;

  document.getElementById('notes').innerHTML = (s.notes || []).map(n =>
    '<div class="note"><h5>' + n[0] + '</h5><p>' + n[1] + '</p></div>').join('');

  document.querySelectorAll('#index [data-go]').forEach(a =>
    a.setAttribute('aria-current', a.dataset.go === s.id ? 'true' : 'false'));

  fit();
}

function setSeg(id, attr, value){
  document.querySelectorAll('#' + id + ' button').forEach(b =>
    b.setAttribute('aria-pressed', b.dataset[attr] === value ? 'true' : 'false'));
}

document.getElementById('seg-device').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.device = b.dataset.device; setSeg('seg-device','device',state.device); render();
});
document.getElementById('seg-product').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.product = b.dataset.product; setSeg('seg-product','product',state.product); render();
});
document.getElementById('seg-sync').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.sync = b.dataset.sync; setSeg('seg-sync','sync',state.sync); render();
});
document.getElementById('btn-annot').addEventListener('click', e => {
  state.annot = state.annot === 'on' ? 'off' : 'on';
  document.body.dataset.annot = state.annot;
  e.currentTarget.setAttribute('aria-pressed', state.annot === 'on' ? 'true' : 'false');
});
document.getElementById('btn-theme').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
});

window.addEventListener('hashchange', () => {
  const id = location.hash.replace('#','');
  if (byId[id]) { state.id = id; render(); }
});
window.addEventListener('resize', () => fit());

buildIndex();
const initial = location.hash.replace('#','');
if (byId[initial]) state.id = initial;
render();
</script>
